<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sinopse Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilo.css?v=1.2">
</head>
<body>

<!-- Ícones (traço único, mesma grade de 24px) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-logo" viewBox="0 0 24 24"><rect x="2.5" y="4.5" width="19" height="13" rx="3"/><path d="M10.3 8.4v5.2l4.3-2.6z" fill="currentColor"/><path d="M8.5 20.5h7"/></symbol>
  <symbol id="i-painel" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></symbol>
  <symbol id="i-livro" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></symbol>
  <symbol id="i-config" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M2 12h3M19 12h3M4.9 19.1L7 17M17 7l2.1-2.1"/></symbol>
  <symbol id="i-busca" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></symbol>
  <symbol id="i-olho" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="i-olho-off" viewBox="0 0 24 24"><path d="M17.9 17.9A10 10 0 0 1 12 20c-7 0-10-8-10-8a18 18 0 0 1 4.1-5.1M9.9 4.2A9 9 0 0 1 12 4c7 0 10 8 10 8a18 18 0 0 1-2.2 3.2M2 2l20 20"/></symbol>
  <symbol id="i-usuario" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
  <symbol id="i-filme" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 11h18M7 7l2-4M13 7l2-4"/></symbol>
  <symbol id="i-globo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></symbol>
  <symbol id="i-camadas" viewBox="0 0 24 24"><path d="M12 2l9 5-9 5-9-5z"/><path d="M3 12l9 5 9-5M3 17l9 5 9-5"/></symbol>
  <symbol id="i-pasta" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-copiar" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/></symbol>
  <symbol id="i-baixar" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
  <symbol id="i-lapis" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="i-exportar" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M12 18v-6M9 15l3 3 3-3"/></symbol>
  <symbol id="i-tabela" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></symbol>
  <symbol id="i-enviar" viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></symbol>
  <symbol id="i-parar" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-mensagens" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
  <symbol id="i-fechar" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></symbol>
  <symbol id="i-mais" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-lixo" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></symbol>
  <symbol id="i-imagem" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></symbol>
  <symbol id="i-alerta" viewBox="0 0 24 24"><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></symbol>
  <symbol id="i-chave" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3L21 2M16 7l3 3M18 5l2 2"/></symbol>
  <symbol id="i-relogio" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></symbol>
  <symbol id="i-desfazer" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
  <symbol id="i-repetir" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></symbol>
  <symbol id="i-banco" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 11v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/></symbol>
  <symbol id="i-peca" viewBox="0 0 24 24"><path d="M10 3h4v3a2 2 0 1 0 4 0V3h3v7h-3a2 2 0 1 0 0 4h3v7h-7v-3a2 2 0 1 0-4 0v3H3v-7h3a2 2 0 1 0 0-4H3V3z"/></symbol>
  <symbol id="i-hash" viewBox="0 0 24 24"><path d="M4 9h16M4 15h16M10 3L8 21M16 3l-2 18"/></symbol>
  <symbol id="i-salvos" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></symbol>
  <symbol id="i-lista" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-recolher" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M15.5 9.5L13 12l2.5 2.5"/></symbol>
</svg>

<div class="app">
  <nav class="trilho" aria-label="Navegação principal">
    <div class="marca"><div class="logo" aria-hidden="true"><svg class="i i-20"><use href="#i-logo"/></svg></div><span class="rot nome-app">Sinopse Editor</span></div>
    <button class="trilho-btn" aria-current="page" aria-label="Trabalho" title="Trabalho"><svg class="i i-20"><use href="#i-painel"/></svg><span class="rot">Trabalho</span></button>
    <button class="trilho-btn" id="btn-minhas" aria-label="Minhas séries" title="Minhas séries"><svg class="i i-20"><use href="#i-filme"/></svg><span class="rot">Minhas séries</span></button>
    <button class="trilho-btn" id="btn-trabalhos" aria-label="Trabalhos salvos" title="Trabalhos salvos"><svg class="i i-20"><use href="#i-salvos"/></svg><span class="rot">Trabalhos salvos</span></button>
    <button class="trilho-btn" id="btn-historico" aria-label="Histórico de envios" title="Histórico de envios"><svg class="i i-20"><use href="#i-relogio"/></svg><span class="rot">Histórico de envios</span></button>
    <div class="recentes" id="recentes" aria-label="Continuar de onde parou"></div>
    <button class="trilho-btn" id="btn-guia" aria-label="Guia de uso" title="Guia de uso"><svg class="i i-20"><use href="#i-livro"/></svg><span class="rot">Guia de uso</span></button>
    <button class="trilho-btn" id="btn-config" aria-label="Configurações" title="Configurações"><svg class="i i-20"><use href="#i-config"/></svg><span class="rot">Configurações</span></button>
    <button class="trilho-btn" id="btn-lateral" aria-label="Recolher a barra lateral" title="Abrir ou recolher a barra lateral"><svg class="i i-20"><use href="#i-recolher"/></svg><span class="rot">Recolher</span></button>
    <span class="versao" id="versao"></span>
  </nav>

  <div class="principal">
    <header class="topo">
      <div class="serie-atual">
        <div class="poster" id="poster" role="img" aria-label="Pôster"><svg class="i"><use href="#i-imagem"/></svg></div>
        <div style="min-width:0">
          <div class="serie-titulo"><h1 id="titulo-serie">Nenhuma série escolhida</h1><span id="subtitulo-serie"></span></div>
          <div class="chips" id="chips"></div>
        </div>
      </div>

      <div class="busca">
        <label>
          <svg class="i"><use href="#i-busca"/></svg>
          <span class="oculto-leitor">Buscar série</span>
          <input id="busca" type="text" placeholder="Buscar série pelo nome ou código" autocomplete="off">
        </label>
        <div class="resultados" id="resultados" role="listbox" aria-label="Resultados da busca"></div>
      </div>

      <div class="topo-direita">
        <button class="btn-contorno" id="btn-navegador" aria-pressed="false" title="Mostrar ou esconder o navegador enquanto trabalha">
          <svg class="i"><use href="#i-olho-off"/></svg><span>Navegador oculto</span>
        </button>
        <button class="conta" id="btn-conta" title="Conta do TMDB">
          <span class="avatar"><svg class="i"><use href="#i-usuario"/></svg></span>
          <span class="conta-txt"><b>TMDB</b><small id="login-txt">Verificando...</small></span>
        </button>
      </div>
    </header>

    <ol class="etapas" id="etapas" aria-label="Etapas do trabalho"></ol>

    <div class="acoes" role="toolbar" aria-label="Ações">
      <div class="grupo">
        <span class="grupo-rotulo">IMPORTAR</span>
        <button class="btn-grupo trava" id="imp-tmdb" title="Textos da temporada escolhida (inglês, ou outros idiomas que o TMDB tiver)"><svg class="i"><use href="#i-filme"/></svg>TMDB</button>
        <button class="btn-grupo trava" id="imp-wiki" title="Textos de uma página de Wiki"><svg class="i"><use href="#i-globo"/></svg>Wiki</button>
        <button class="btn-grupo trava" id="imp-tvdb" title="Textos em inglês de uma temporada no TVDB (só leitura)"><svg class="i"><use href="#i-banco"/></svg>TVDB</button>
        <button class="btn-grupo trava" id="imp-lote" title="Várias temporadas ou séries de uma vez"><svg class="i"><use href="#i-camadas"/></svg>Lote</button>
        <button class="btn-grupo trava" id="imp-planilha" title="Abrir uma planilha CSV"><svg class="i"><use href="#i-pasta"/></svg>Planilha</button>
      </div>
      <div class="grupo">
        <span class="grupo-rotulo">TRADUZIR</span>
        <button class="btn-roxo" id="btn-copiar"><svg class="i"><use href="#i-copiar"/></svg><span>Copiar para traduzir</span></button>
        <button class="btn-roxo-suave" id="btn-colar"><svg class="i"><use href="#i-baixar"/></svg><span>Colar tradução</span></button>
        <button class="btn-grupo" id="btn-instrucoes" aria-label="Editar instruções de tradução" title="Instruções de tradução"><svg class="i"><use href="#i-lapis"/></svg></button>
        <button class="btn-grupo" id="btn-glossario" aria-label="Glossário da série" title="Glossário da série (opcional)"><svg class="i"><use href="#i-livro"/></svg></button>
      </div>
      <div class="espaco"></div>
      <div class="grupo">
        <span class="grupo-rotulo">SALVAR</span>
        <button class="btn-grupo" id="btn-exportar" aria-label="Salvar planilha" title="Salvar planilha: guarda a lista de episódios (com a tradução) num arquivo"><svg class="i"><use href="#i-exportar"/></svg></button>
        <button class="btn-grupo" id="btn-modelo" aria-label="Modelo vazio" title="Modelo vazio: baixa uma planilha em branco para preencher à mão e depois usar em Importar › Planilha"><svg class="i"><use href="#i-tabela"/></svg></button>
      </div>
    </div>

    <div class="centro">
      <section class="lista" aria-label="Episódios">
        <div class="lista-topo">
          <span class="total" id="total">Nenhum episódio</span>
          <span class="resumo" id="resumo"></span>
          <div class="espaco"></div>
          <button class="btn-mini trava" id="btn-pt-tvdb" hidden title="Usar o título e a sinopse em português que o TVDB já tem"><svg class="i"><use href="#i-banco"/></svg><span></span></button>
          <button class="btn-mini trava" id="btn-complementar" hidden title="Buscar em outro site o texto que falta"><svg class="i"><use href="#i-peca"/></svg><span></span></button>
          <button class="btn-mini trava" id="btn-repetir" hidden title="Marca só os que falharam e envia de novo"><svg class="i"><use href="#i-repetir"/></svg><span></span></button>
          <div class="filtros" id="filtros">
            <button data-f="pendentes" aria-pressed="true">Pendentes</button>
            <button data-f="todos" aria-pressed="false">Todos</button>
            <button data-f="marcados" aria-pressed="false">Marcados</button>
            <button data-f="desmarcados" aria-pressed="false">Não marcados</button>
            <button data-f="problema" aria-pressed="false">Com problema</button>
            <button data-f="enviados" aria-pressed="false">Enviados</button>
          </div>
          <button class="btn-mini" id="btn-compacta" title="Lista compacta (liga/desliga)" aria-label="Lista compacta" aria-pressed="false" style="width:30px;padding:0;justify-content:center"><svg class="i"><use href="#i-lista"/></svg></button>
          <button class="btn-mini" id="btn-lado" title="Comparar lado a lado (original x tradução)" aria-label="Comparar lado a lado" style="width:30px;padding:0;justify-content:center"><svg class="i"><use href="#i-tabela"/></svg></button>
          <button class="btn-mini" id="btn-localizar" title="Localizar e substituir (Ctrl+F)" aria-label="Localizar e substituir" style="width:30px;padding:0;justify-content:center"><svg class="i"><use href="#i-busca"/></svg></button>
          <button class="btn-mini" id="btn-numeracao" title="Ajustar numeração" aria-label="Ajustar numeração" style="width:30px;padding:0;justify-content:center"><svg class="i"><use href="#i-hash"/></svg></button>
          <button class="btn-mini" id="btn-prefixo" title="Prefixo nos títulos (Quest 01, Space.1...)" aria-label="Prefixo nos títulos" style="width:30px;padding:0;justify-content:center"><svg class="i"><use href="#i-lapis"/></svg></button>
          <button class="btn-mini" id="btn-limpar" title="Limpar a lista" aria-label="Limpar a lista" style="width:30px;padding:0;justify-content:center"><svg class="i"><use href="#i-lixo"/></svg></button>
        </div>
        <div class="colunas">
          <label><input type="checkbox" id="marcar-todos" aria-label="Marcar todos os visíveis"></label>
          <span>EP</span><span>TÍTULO E SINOPSE</span><span class="dir">TAMANHO</span><span>SITUAÇÃO</span>
        </div>
        <div class="rolagem" id="rolagem"></div>
      </section>

      <aside class="inspetor" id="inspetor" aria-label="Editar episódio"></aside>
    </div>

    <footer class="rodape">
      <div class="progresso">
        <div class="progresso-txt"><span id="prog-txt">Pronto.</span><span class="seg" id="prog-seg"></span></div>
        <div class="trilha" id="trilha"><div id="trilha-barra"></div></div>
      </div>
      <button class="btn-contorno" id="btn-mensagens" aria-pressed="false"><svg class="i"><use href="#i-mensagens"/></svg>Mensagens</button>
      <div class="substituir">
        <span class="grupo-rotulo">SE JÁ EXISTIR NO TMDB</span>
        <div>
          <button class="alternar" id="sub-titulo" aria-pressed="false">Manter títulos</button>
          <button class="alternar" id="sub-sinopse" aria-pressed="false">Manter sinopses</button>
        </div>
      </div>
      <button class="btn-parar" id="btn-parar" hidden><svg class="i"><use href="#i-parar"/></svg>Parar</button>
      <button class="btn-enviar trava" id="btn-enviar"><svg class="i"><use href="#i-enviar"/></svg><span id="txt-enviar">Enviar</span></button>
    </footer>
  </div>
</div>

<div class="mensagens" id="mensagens" role="log" aria-label="Mensagens">
  <header>Mensagens <button class="btn-mini" id="fechar-mensagens"><svg class="i"><use href="#i-fechar"/></svg>Fechar</button></header>
  <pre id="log"></pre>
</div>
<div class="avisos" id="avisos" aria-live="polite"></div>
<div class="notificacoes" id="notificacoes" aria-live="polite"></div>
<div id="modais"></div>

<script src="app.js?v=1.2"></script>
</body>
</html>
